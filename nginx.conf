events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Round-robin across 5 backends using the last digit of a request counter
    # $connection is a monotonically increasing connection number — good enough for spreading load
    map $connection $backend {
        ~*[05]$ "smart-attendance-backend:8081";
        ~*[16]$ "smart-attendance-backend-1:8081";
        ~*[27]$ "smart-attendance-backend-2:8081";
        ~*[38]$ "smart-attendance-backend-3:8081";
        ~*[49]$ "smart-attendance-backend-4:8081";
        default "smart-attendance-backend:8081";
    }

    server {
        listen 80;

        location /api/attendance/ {
            # Variable assignment forces runtime DNS resolution — no startup crash
            set $upstream $backend;
            proxy_pass http://$upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}