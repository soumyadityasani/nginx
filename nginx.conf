events { 
    worker_connections 1024; 
}

http {
    upstream attendance_cluster {
        # Replace these with your actual Render Internal Service URLs
        # Render internal URLs usually look like: name:port
        server smart-attendance-backend:10000;
        server smart-attendance-backend-1:10000;
        server smart-attendance-backend-2:10000;
        server smart-attendance-backend-3:10000;
        server smart-attendance-backend-4:10000;
        # server attendance-service-5:10000;
        # server attendance-service-6:10000;
        # server attendance-service-7:10000;
        # server attendance-service-8:10000;
        # server attendance-service-9:10000;
        # server attendance-service-10:10000;
        
        keepalive 32;
    }

    server {
        listen 80;

        location /api/attendance/ {
            proxy_pass http://attendance_cluster;

            # Standard Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optimization for your 0.1 CPU instances
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        
            # Reliability: If one instance is slow/dead, try the next one
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}